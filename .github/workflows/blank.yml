# ---- Proactive reminders ------------------------------------------------

class ReminderParams(BaseModel):
    raw_text: str
    fire_in_seconds: int = 60


@app.post("/reminders/schedule")
async def schedule_reminder(params: ReminderParams):
    fire_at = time.time() + params.fire_in_seconds
    scheduler.add_job(
        func=lambda: print(f"[Nexa reminder] {params.raw_text}"),  # replace with push/audio trigger
        trigger="date",
        run_date=time.strftime("%Y-%m-%d %H:%M:%S", time.localtime(fire_at)),
    )
    return {"scheduled": True, "fire_at": fire_at}


# ---- Message summarization & smart replies -------------------------------
#
# Both stubbed with simple heuristics below so the end-to-end pipeline
# (notification -> summarize -> TTS, and dictate -> draft -> send) is
# testable without any external API key. For real quality, swap
# summarize_text()/draft_reply_text() to call an LLM (e.g. the Claude API)
# with the incoming text and a short system prompt — that's a five-line
# change here, not a redesign.

class SummarizeParams(BaseModel):
    sender: str
    text: str


def summarize_text(text: str) -> str:
    # Heuristic placeholder: first sentence + length flag. Replace with a
    # real LLM call for actual quality summarization.
    first_sentence = re.split(r"(?<=[.!?])\s+", text.strip())[0]
    return first_sentence if len(first_sentence) < 160 else first_sentence[:157] + "..."


@app.post("/summarize")
async def summarize(params: SummarizeParams):
    return {"summary": summarize_text(params.text)}


class DraftReplyParams(BaseModel):
    sender: str
    original_text: str
    instruction: str  # what the user told Nexa to say, in their own words


def draft_reply_text(original_text: str, instruction: str) -> str:
    # Heuristic placeholder: lightly formats the user's dictated instruction.
    # Replace with an LLM call that takes original_text + instruction and
    # returns a polished, natural reply in the user's usual tone.
    cleaned = instruction.strip()
    if cleaned and cleaned[0].islower():
        cleaned = cleaned[0].upper() + cleaned[1:]
    if cleaned and cleaned[-1] not in ".!?":
        cleaned += "."
    return cleaned


@app.post("/reply/draft")
async def draft_reply(params: DraftReplyParams):
    return {"draft": draft_reply_text(params.original_text, params.instruction)}
