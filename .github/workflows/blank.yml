"""
Nexa backend — NLP intent parsing, voice biometric gate, booking search,
proactive reminder scheduling.

Run: uvicorn app.main:app --host 0.0.0.0 --port 8000

This is a scaffold: the intent parser is rule-based (swap for a trained
classifier or an LLM call), the voice-print compare is a stand-in (swap for
resemblyzer/ECAPA-TDNN embeddings), and booking is a stub (wire a real
travel API — Amadeus, Skyscanner, IRCTC-class provider — behind search_booking).
"""
from fastapi import FastAPI, Request
from pydantic import BaseModel
from apscheduler.schedulers.background import BackgroundScheduler
import numpy as np
import re
import time

app = FastAPI(title="Nexa Backend")
scheduler = BackgroundScheduler()
scheduler.start()

# ---- Voice biometric gate -------------------------------------------------

# Enrolled voiceprint would be captured during onboarding and stored securely
# (Android Keystore-backed, never plaintext). Placeholder embedding below.
ENROLLED_EMBEDDING = np.random.rand(256)
MATCH_THRESHOLD = 0.75


def audio_to_embedding(raw_audio: bytes) -> np.ndarray:
    """Placeholder: replace with a real speaker-embedding model
    (e.g. resemblyzer.VoiceEncoder().embed_utterance(wav))."""
    seed = sum(raw_audio[:1000]) if raw_audio else 0
    rng = np.random.RandomState(seed % (2**32))
    return rng.rand(256)


@app.post("/voice/verify")
async def verify_voice(request: Request):
    raw = await request.body()
    embedding = audio_to_embedding(raw)
    similarity = float(
        np.dot(embedding, ENROLLED_EMBEDDING)
        / (np.linalg.norm(embedding) * np.linalg.norm(ENROLLED_EMBEDDING))
    )
    return {"match": similarity >= MATCH_THRESHOLD, "score": similarity}


# ---- Intent parsing ---------------------------------------------------

class ParseRequest(BaseModel):
    text: str


INTENT_RULES = [
    (re.compile(r"\b(flashlight|torch)\b.*\b(on)\b", re.I), "device_control", "flashlight_on", {}),
    (re.compile(r"\b(flashlight|torch)\b.*\b(off)\b", re.I), "device_control", "flashlight_off", {}),
    (re.compile(r"\banswer\b.*\bcall\b", re.I), "device_control", "answer_call", {}),
    (re.compile(r"\b(end|hang up|cut)\b.*\bcall\b", re.I), "device_control", "end_call", {}),
    (re.compile(r"\bbook\b.*\b(train|flight|bus|hotel)\b", re.I), "booking", "search", {}),
    (re.compile(r"\bremind me\b", re.I), "reminder", "create", {}),
]


@app.post("/nlp/parse")
async def parse_intent(req: ParseRequest):
    for pattern, domain, action, extra_params in INTENT_RULES:
        if pattern.search(req.text):
            return {"domain": domain, "action": action, "params": {"raw_text": req.text, **extra_params}}
    return {"domain": "unknown", "action": "none", "params": {"raw_text": req.text}}


